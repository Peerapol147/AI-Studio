<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000}
main{position:relative;width:1080px;height:1920px}
canvas{position:absolute;left:0;top:0}
#ov{position:absolute;inset:0;pointer-events:none;font-family:'Kanit',sans-serif}
.st{-webkit-text-stroke:14px #1a1218;paint-order:stroke fill;text-shadow:0 8px 0 rgba(0,0,0,.35)}
#title{position:absolute;left:50%;top:300px;width:900px;text-align:center;font-weight:900;font-size:118px;line-height:1.1;color:#fff;transform-origin:50% 50%}
#title b{color:#ffd23f;font-weight:900}
#cap{position:absolute;left:50%;top:1135px;max-width:780px;white-space:nowrap;text-align:center;font-weight:700;font-size:80px;line-height:1.25;transform-origin:50% 60%}
#tag{position:absolute;left:90px;top:262px;padding:6px 30px 10px;border-radius:40px;font-weight:700;font-size:54px;color:#1a1218;border:6px solid #1a1218;transform-origin:0 50%}
#beep{position:absolute;left:300px;top:520px;padding:10px 40px 18px;background:#e23b3b;color:#fff;border:8px solid #1a1218;border-radius:30px;font-weight:900;font-size:110px;transform-origin:50% 50%}
#q{position:absolute;left:50%;top:290px;width:880px;text-align:center;font-weight:900;font-size:96px;line-height:1.15;color:#fff;transform-origin:50% 50%}
#q b{color:#ffd23f}
.cm{position:absolute;display:flex;align-items:center;gap:20px;background:#fffaf0;color:#2a1e22;border:5px solid #1a1218;border-radius:28px;padding:12px 30px 16px 16px;font-size:46px;font-weight:700;transform-origin:0 50%;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.cm i{display:block;width:60px;height:60px;border-radius:50%;border:4px solid #1a1218}
</style></head><body><main>
<div id="love" style="position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% 45%, rgba(255,210,230,0) 45%, rgba(255,150,200,.45) 80%, rgba(255,120,185,.7) 100%);mix-blend-mode:screen"></div>
<div id="ov">
  <div id="title" class="st">นึกว่าจะ<b>ต่อยกัน</b>...</div>
  <div id="tag"></div>
  <div id="q" class="st">ถ้าเป็นเรา<br><b>จะขอโทษก่อนไหม?</b></div>
  <div id="comments"></div>
  <div id="beep" class="st" style="-webkit-text-stroke:10px #1a1218">ตี๊ด!</div>
  <div id="cap" class="st"></div>
</div></main>
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
<script src="engine/lib.js"></script><script src="engine/characters.js"></script><script src="engine/scenery.js"></script>
<script>
// p5 global mode: canvas goes into <main>; DATA loaded before episode
window.DATA = null;
const _setup = () => {};
</script>
<script>
const xhr = new XMLHttpRequest(); xhr.open('GET', 'episode-data.json', false); xhr.send(); window.DATA = JSON.parse(xhr.responseText);
</script>
<script src="episode.js"></script>
<script src="engine/player.js"></script>
<script>
window.addEventListener('load', async () => { await document.fonts.ready; await document.fonts.load('900 100px Kanit', 'นึก'); await document.fonts.load('700 80px Kanit', 'นึก');
  const c = document.querySelector('canvas'); if (c) document.querySelector('main').prepend(c); window.ready = true; });
</script>
</body></html>
