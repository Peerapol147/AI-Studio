<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<!-- Thumbnail (1 frame, 1080x1920) = thumbnail.md concept 1: the frame-0 image (river_moon_v at source 0, same crop and
     night grade = video/assets/hook0.jpg), the same red-pink fireball rising off the water with its reflection and ripples,
     a faint naga shadow under the water, title "ลูกไฟนี้" / "ใครจุด?" (yellow) Kanit 900 white, dark outline, in the frame-0
     title zone (Y 240-700). Nothing in Y 0-240 / 1440-1920 except image; nothing important right of X 900 below Y 840. -->
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#070b1c}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.dim{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(circle at 632px 270px,rgba(4,7,20,.66) 0px,rgba(4,7,20,.48) 260px,rgba(4,7,20,0) 520px)}
.shade{position:absolute;left:0;top:0;width:1080px;height:900px;background:linear-gradient(rgba(4,6,18,.84) 0%,rgba(4,6,18,.58) 58%,rgba(4,6,18,0) 100%)}
.vig{position:absolute;left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse at 50% 50%,rgba(7,11,28,0) 50%,rgba(3,5,14,.6) 100%)}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;color:#fff;
  -webkit-text-stroke:30px #10080A;paint-order:stroke fill;text-shadow:0 14px 0 rgba(0,0,0,.5)}
#t1{top:246px;font-size:200px}
#t2{top:462px;font-size:228px;color:#FFE14D}
#fx{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<img class="clip" id="bg" data-start="0" data-duration="1" data-track-index="0" src="assets/hook-cover.jpg" alt=""/>
<div class="dim"></div>
<svg id="fx" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="gHalo"><stop offset="0" stop-color="#ff4f7a" stop-opacity=".75"/><stop offset=".45" stop-color="#ff4f7a" stop-opacity=".28"/><stop offset="1" stop-color="#ff4f7a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gBody"><stop offset="0" stop-color="#ffe4ea"/><stop offset=".38" stop-color="#ff8aa6"/><stop offset=".72" stop-color="#ff4f7a" stop-opacity=".85"/><stop offset="1" stop-color="#ff4f7a" stop-opacity="0"/></radialGradient>
    <radialGradient id="gCore"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#ffd0dc"/><stop offset="1" stop-color="#ffd0dc" stop-opacity="0"/></radialGradient>
    <linearGradient id="gRefl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6f92" stop-opacity=".5"/><stop offset="1" stop-color="#ff4f7a" stop-opacity="0"/></linearGradient>
  </defs>
  <!-- faint naga shadow under the water (same silhouette as s10/s11, naga.js), drawn by the script below -->
  <g id="nagaT" opacity=".62"></g>
  <g style="mix-blend-mode:screen">
    <ellipse cx="520" cy="1610" rx="30" ry="200" fill="url(#gRefl)"/>
    <ellipse cx="530" cy="1428" rx="62" ry="3.5" fill="#ff8aa6" opacity=".7"/><ellipse cx="512" cy="1470" rx="48" ry="3" fill="#ff8aa6" opacity=".55"/><ellipse cx="526" cy="1515" rx="36" ry="3" fill="#ff8aa6" opacity=".45"/>
    <g transform="translate(520 1030) scale(1.15)">
      <circle r="230" fill="url(#gHalo)" opacity=".5"/><circle r="118" fill="url(#gHalo)" opacity=".9"/><circle r="60" fill="url(#gBody)"/><circle r="25" fill="url(#gCore)"/>
      <circle cx="58" cy="-20" r="4" fill="#ffd0dc"/><circle cx="-50" cy="34" r="3" fill="#ffd0dc"/><circle cx="20" cy="66" r="2.5" fill="#ffd0dc"/><circle cx="-62" cy="-40" r="3.5" fill="#ffd0dc"/>
    </g>
  </g>
  <ellipse cx="520" cy="1406" rx="270" ry="43" fill="none" stroke="#ffd0dc" stroke-width="3" opacity=".45"/>
  <ellipse cx="520" cy="1406" rx="170" ry="27" fill="none" stroke="#ffd0dc" stroke-width="4" opacity=".65"/>
  <ellipse cx="520" cy="1406" rx="80" ry="13" fill="none" stroke="#ffd0dc" stroke-width="4" opacity=".8"/>
</svg>
<div class="vig"></div>
<div class="shade"></div>
<div class="t" id="t1">ลูกไฟนี้</div>
<div class="t" id="t2">ใครจุด?</div>
</div><script src="naga.js"></script><script>
(function(){ // static spine: head left (facing left) under the water, S-body trailing right and fading into the depth
  const pts=[[330,1600]]; let x=330,y=1600; for(let i=1;i<=40;i++){const s=i*22, th=0.10+0.5*s/880+0.5*(1-Math.exp(-s/180))*Math.sin(0.0048*s-1.0); x+=Math.cos(th)*22; y+=Math.sin(th)*22; pts.push([x,y]);}
  NagaRig(document.getElementById('nagaT')).set(pts,0.95,0.5,0.7);
})();
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines["thumb"]=tl;</script></body></html>
