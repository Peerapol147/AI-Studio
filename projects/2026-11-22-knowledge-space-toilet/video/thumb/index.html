<!-- Thumbnail (1 frame, 1080x1920) = thumbnail.md concept A, built like frame 0: Chris Cassidy (face visible, smiling)
     in the station as the same rounded tilted card on its own blurred plate, same space grade (video/assets/hook-*.jpg);
     title zone Y 240-700: "ปวดอึ" / "ในอวกาศ?" Kanit 900 white, dark outline; the episode's ONE shape (cute pale-yellow
     drop, worried face, own drawing, never waste) peeks over the card corner with a yellow "?".

<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#071027}
#bg{position:absolute;left:-40px;top:-70px;width:1160px;height:2060px;object-fit:cover}
.card{position:absolute;left:140px;top:700px;width:760px;height:720px;overflow:hidden;border-radius:46px;transform:rotate(-2deg);
  box-shadow:0 0 0 10px #F4F8FF,0 0 0 19px #0A0E1C,0 36px 80px rgba(0,0,0,.65)}
.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;left:0;top:0;width:1080px;height:800px;background:linear-gradient(rgba(4,8,26,.85) 0%,rgba(4,8,26,.6) 60%,rgba(4,8,26,0) 100%)}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;color:#fff;
  -webkit-text-stroke:32px #0A0E1C;paint-order:stroke fill;text-shadow:0 16px 0 rgba(0,0,0,.5)}
#t1{top:236px;font-size:270px}
#t2{top:500px;font-size:170px}
#fx{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">

<div class="card"><img src="assets/hook-card.jpg" alt=""/></div>

    <path d="M0 -190 C40 -120 150 -40 150 50 C150 140 85 190 0 190 C-85 190 -150 140 -150 50 C-150 -40 -40 -120 0 -190 Z"
      fill="#FFE7A0" stroke="#0A0E1C" stroke-width="15" stroke-linejoin="round"/>
    <path d="M-95 -10 q10 -60 55 -95" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity=".7"/>
    <path d="M-28 2 L-66 -8 M28 2 L66 -8" fill="none" stroke="#0A0E1C" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="-48" cy="40" rx="16" ry="21" fill="#0A0E1C"/><ellipse cx="48" cy="40" rx="16" ry="21" fill="#0A0E1C"/>
    <circle cx="-43" cy="32" r="5" fill="#fff"/><circle cx="53" cy="32" r="5" fill="#fff"/>

  </g>
  <text x="815" y="1150" text-anchor="middle" font-family="Kanit" font-weight="900" font-size="170" fill="#FFE14D" stroke="#0A0E1C"
