<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<!-- Thumbnail (1 frame, 1080x1920) = thumbnail.md concept A, built like frame 0: the backlit pumpjack card over the blurred
     same photo (video/assets/hook-*.jpg, same grade), the red nearly-empty energy bar (same graphic as the clip) on the
     dark ground, title "น้ำมันหมดปีไหน?" (Kanit 900, white, dark outline, "หมด" orange #FF7A1A) in Y 240-700.
     Nothing in Y 0-240 / 1440-1920, nothing important right of X 900 below Y 840. -->
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#0E0E10}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover;transform:scale(1.06)}
.card{position:absolute;left:100px;top:690px;width:820px;height:680px;border-radius:34px;overflow:hidden;box-shadow:0 0 0 8px #0E0E10,0 34px 80px rgba(0,0,0,.65)}
.card img{width:100%;height:100%;object-fit:cover;transform:scale(1.03)}
.shade{position:absolute;left:0;top:0;width:1080px;height:860px;background:linear-gradient(rgba(14,14,16,.82) 0%,rgba(14,14,16,.6) 60%,rgba(14,14,16,0) 100%)}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;color:#fff;
  -webkit-text-stroke:30px #0E0E10;paint-order:stroke fill;text-shadow:0 14px 0 rgba(0,0,0,.5)}
.t b{color:#FF7A1A;font-weight:900}
#t1{top:290px;font-size:190px}
#t2{top:496px;font-size:190px}
#bat{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<img class="clip" id="bg" data-start="0" data-duration="1" data-track-index="0" src="assets/hook-bg.jpg" alt=""/>
<div class="card"><img src="assets/hook-card.jpg" alt=""/></div>
<svg id="bat" viewBox="0 0 1080 1920">
  <g transform="translate(510 1255)">
    <rect x="-260" y="-70" width="520" height="140" rx="36" fill="none" stroke="#0E0E10" stroke-width="18"/>
    <rect x="-260" y="-70" width="520" height="140" rx="36" fill="rgba(14,14,16,.85)" stroke="#F4EFE6" stroke-width="8"/>
    <rect x="264" y="-30" width="18" height="60" rx="6" fill="#F4EFE6" stroke="#0E0E10" stroke-width="4"/>
    <rect x="-244" y="-54" width="58" height="108" rx="22" fill="#FF3B30"/>
    <rect x="-244" y="-50" width="58" height="32" rx="14" fill="#fff" opacity=".25"/>
  </g>
  <g transform="translate(850 1255)"><circle r="62" fill="#FF3B30" opacity=".3"/><circle r="44" fill="#FF3B30" stroke="#0E0E10" stroke-width="6"/>
    <g transform="translate(-28 -30) scale(2.33)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/></g></g>
</svg>
<div class="shade"></div>
<div class="t" id="t1">น้ำมัน<b>หมด</b></div>
<div class="t" id="t2">ปีไหน?</div>
</div><script>
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines["thumb"]=tl;</script></body></html>
