<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<!-- Cover (1 frame, 1080x1920) = thumbnail.md concept A = frame 0 of the clip: split screen blue (Messi) | red (Ronaldo),
     both face cards (logo-free crops from prep_assets.py), VS badge on the split, "ใครเก่งกว่า?" Kanit 900 yellow with a dark
     outline in Y 240-700. Same coordinates as #g-hook / #title in index.html.tpl at t=0. No channel name anywhere. -->
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#0B1026}
.full{position:absolute;left:0;top:0;width:1080px;height:1920px}
.card{position:absolute;width:460px;height:560px;border-radius:30px;overflow:hidden;background:#111;box-shadow:0 0 0 10px #fff,0 0 0 17px #10080A,0 34px 70px rgba(0,0,0,.55)}
.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.nm{position:absolute;bottom:20px;height:92px;padding:0 30px;border-radius:24px;border:6px solid #10080A;color:#fff;font-weight:900;font-size:58px;line-height:80px;white-space:nowrap;box-shadow:0 8px 0 rgba(0,0,0,.4)}
#vs{position:absolute;left:440px;top:840px;width:200px;height:200px;border-radius:100px;background:#FFE14D;color:#10080A;font-weight:900;font-size:96px;
  border:10px solid #10080A;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 0 rgba(0,0,0,.4)}
#tshade{position:absolute;left:0;top:0;width:1080px;height:760px;background:linear-gradient(rgba(6,8,24,.7) 0%,rgba(6,8,24,.45) 60%,rgba(6,8,24,0) 100%)}
.tl{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;color:#FFE14D;
  -webkit-text-stroke:28px #10080A;paint-order:stroke fill;text-shadow:0 14px 0 rgba(0,0,0,.5)}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<svg class="full" viewBox="0 0 1080 1920">
  <defs><linearGradient id="gL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6CB4EE"/><stop offset="1" stop-color="#1D4E89"/></linearGradient>
    <linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D7263D"/><stop offset="1" stop-color="#6E0A18"/></linearGradient>
    <pattern id="pS" width="64" height="64" patternUnits="userSpaceOnUse"><rect width="22" height="64" fill="#fff" opacity=".07"/></pattern>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%"><stop offset=".55" stop-color="#0B1026" stop-opacity="0"/><stop offset="1" stop-color="#0B1026" stop-opacity=".55"/></radialGradient></defs>
  <rect x="0" y="0" width="540" height="1920" fill="url(#gL)"/><rect x="540" y="0" width="540" height="1920" fill="url(#gR)"/>
  <rect x="-400" y="-400" width="1880" height="2720" fill="url(#pS)" transform="rotate(28 540 960)"/>
  <rect width="1080" height="1920" fill="url(#vig)"/>
  <rect x="526" y="0" width="28" height="1920" fill="#10080A"/><rect x="534" y="0" width="12" height="1920" fill="#fff"/>
</svg>
<div class="card" style="left:55px;top:660px;transform:rotate(-3deg)"><img class="clip" id="imM" data-start="0" data-duration="1" data-track-index="1" src="assets/messi_face.jpg" alt=""/><div class="nm" style="left:50%;transform:translateX(-50%);background:#2F86D6">เมสซี่</div></div>
<div class="card" style="left:565px;top:660px;transform:rotate(3deg)"><img class="clip" id="imR" data-start="0" data-duration="1" data-track-index="2" src="assets/ronaldo_face.jpg" alt=""/><div class="nm" style="left:34px;background:#D7263D">โรนัลโด้</div></div>
<div id="vs">VS</div>
<div id="tshade"></div>
<div class="tl" style="top:250px;font-size:200px">ใคร</div>
<div class="tl" style="top:446px;font-size:180px">เก่งกว่า?</div>
</div><script>
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines["thumb"]=tl;</script></body></html>
