<!doctype html>
<!-- Cover (thumbnail to upload) = a separate still, NOT frame 0 (palmaris feedback 8, 2026-11-26: "ปกชีพ ไม่น่ากด",
     best CTR so far 11%). Frame 0 of the clip still has to be understood in 1 s with the sound off (Shorts feed shows
     frame 0); this cover can be a curiosity line instead. Make 2 variants (A/B) every episode.
     TEXT, COLOURS AND FONT COME FROM look.json, never typed here (review 2026-11-26: the image and the checked text
     must be the same): tools/cover_shot.js reads <project>/look.json "covers" (lines <= 2, *word* = accent, optional
     "badge") + the look's palette and font from templates/looks/looks.json, and injects them as window.__COVER.
     1. look.json "covers": [{"id": "a", "lines": [..]}, {"id": "b", "lines": [..]}]  (facts only from research.md)
     2. Draw the hero picture inside #art (hand rig: compositions/components/hand-rig/, footage still, graphic).
     3. node ../../../tools/cover_shot.js cover.html ../covers a,b   (from video/)  -> covers/cover-a.jpg, cover-b.jpg
     4. python3 tools/cover_check.py projects/<x>   (text = look.json, lines, repeats, overlap, edges, 200 px, old covers)
     Opened without cover_shot.js it shows a placeholder ("แก้ข้อความ / ใน look.json"), so a forgotten cover cannot
     pass as a real one. Variant b = light field in the look's accent colour, a = dark field in the look's bg colours.
     Mark every text line data-cover="text", the series badge data-cover="badge", the hero picture data-cover="art". -->
<html lang="th"><head><meta charset="UTF-8"/><meta name="viewport" content="width=1080, height=1920"/>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{--bg:#2A0F12;--bg2:#C2453A;--ink:#1A0A06;--text:#FFFFFF;--accent:#FFD23F;--accent2:#FF8A5B;--panel:#3D1714;--font:'Kanit'}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:var(--font),sans-serif;
  background:radial-gradient(ellipse 640px 800px at 540px 1060px,var(--bg2) 0%,var(--bg) 100%)}
#art{position:absolute;left:90px;top:760px;width:900px;height:900px;z-index:2}
#title{position:absolute;left:60px;right:60px;top:260px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:8px}
.tl{font-weight:var(--tw,900);font-size:170px;line-height:1.3;white-space:nowrap;text-align:center;color:var(--text);
  paint-order:stroke fill;-webkit-text-stroke:28px var(--ink);text-shadow:0 16px 0 rgba(0,0,0,.4)}
.tl b{color:var(--accent)}
#badge{position:absolute;left:60px;top:140px;z-index:6;font-weight:700;font-size:42px;line-height:1;color:var(--ink);
  background:var(--accent);padding:12px 24px 16px;border-radius:999px;box-shadow:0 0 0 5px var(--ink)}
/* variant b: light field, dark type (A/B should differ in more than the words) */
#root.vb{background:radial-gradient(ellipse 640px 820px at 540px 1040px,#fff3c4 0%,var(--accent) 60%,var(--accent2) 100%)}
#root.vb .tl{color:var(--ink);-webkit-text-stroke-color:#fff;text-shadow:none}
#root.vb .tl b{color:var(--bg2)}

/* caffeine-ranking (ปก A never-colonized style): real photo on a dark field + highlighted word on a tilted plate +
   corner badge + hand-drawn arrow/ring. No clip-art. A: arrow points at the americano (never ring the bottle).
   B: 4 drinks as a staircase, ring around the ? above the tallest. Real objects = palette mixes (no new hex). */
#root{--amber-d:color-mix(in srgb,var(--ink) 82%,var(--accent2));--amber-m:color-mix(in srgb,var(--accent2) 52%,var(--ink));
  --amber-l:color-mix(in srgb,color-mix(in srgb,var(--accent) 45%,var(--accent2)) 78%,var(--ink))}
#root,#root.vb{background:radial-gradient(ellipse 760px 980px at 700px 1250px,color-mix(in srgb,var(--accent2) 40%,var(--ink)) 0%,var(--ink) 100%)}
#root.vb{background:radial-gradient(ellipse 900px 760px at 1080px 1300px,color-mix(in srgb,var(--accent) 34%,var(--ink)) 0%,color-mix(in srgb,var(--bg) 70%,var(--ink)) 100%)}
#root.vb .tl{color:var(--text);-webkit-text-stroke-color:var(--ink);text-shadow:0 16px 0 rgba(0,0,0,.4)}
#title{top:300px;gap:40px}
#title .tl b{display:inline-block;background:var(--accent);color:var(--ink);padding:0 22px 8px;margin:0 4px;border-radius:22px;
  transform:rotate(-3deg);box-shadow:0 0 0 10px var(--ink),0 18px 0 rgba(0,0,0,.35);-webkit-text-stroke:0}
#root.vb #title .tl b{background:var(--accent2);color:var(--ink)}
#badge{transform:rotate(-6deg);font-size:66px;padding:14px 34px 22px;left:70px;top:110px}
#root.vb #badge{background:var(--accent2)}
#art{left:0;top:0;width:1080px;height:1920px}
.va,.vbart{display:none}
#root:not(.vb) .va{display:block}
#root.vb .vbart{display:block}
.pc{position:absolute;border-radius:34px;overflow:hidden;box-shadow:0 0 0 9px var(--ink),0 34px 70px rgba(0,0,0,.6)}
.pc img{width:100%;height:100%;object-fit:cover;display:block}
.bt{position:absolute}
.bt svg{width:100%;height:100%;overflow:visible}
.hand{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:visible}
.hand path{fill:none;stroke:var(--accent);stroke-width:18;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
.cut{position:absolute;filter:drop-shadow(0 40px 40px rgba(0,0,0,.6))}
.cut img{width:100%;display:block}
.q{position:absolute;font-weight:900;font-size:170px;line-height:1;color:var(--accent);-webkit-text-stroke:14px var(--ink);paint-order:stroke fill}
.flr{position:absolute;left:0;top:1640px;width:1080px;height:280px;background:linear-gradient(color-mix(in srgb,var(--ink) 40%,transparent),var(--ink))}
</style></head><body>

<script>
// injected by tools/cover_shot.js from look.json; the placeholder below is only for opening the file by hand
const C = window.__COVER || { lines: ['แก้ข้อความ', 'ใน look.json'], badge: '', vars: {} };
const v = new URLSearchParams(location.search).get('v') || 'a';
const root = document.getElementById('root');
for (const [k, val] of Object.entries(C.vars || {})) root.style.setProperty(k, val);
if (v === 'b') root.classList.add('vb');
const c = C;
const esc = s => s.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
document.getElementById('title').innerHTML =
  c.lines.map(l => `<div class="tl" data-cover="text">${esc(l).replace(/\*([^*]+)\*/g, '<b>$1</b>')}</div>`).join('');
{ const tls = [...document.querySelectorAll('#title .tl')]; let fs = 150;
  const fit = () => { tls.forEach(el => el.style.fontSize = fs + 'px'); return tls.every(el => el.scrollWidth <= 940); };
  while (!fit() && fs > 60) fs -= 4; }
const bd = document.getElementById('badge');
if (c.badge) bd.textContent = c.badge; else bd.remove();
// draw the hero picture into #art here (e.g. window.HandRig, see compositions/components/hand-rig/README.md)
</script>
