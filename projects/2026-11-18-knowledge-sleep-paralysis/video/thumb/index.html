// ---------- hook title: on screen from frame 0, breathes 1.0 <-> 1.04 ----------
(function(){ $('tl1').style.cssText+='top:235px;font-size:190px;color:#fff'; $('tl2').style.cssText+='top:445px;font-size:158px;color:#FFD23F'; })();
function title(t){

  ['tl1','tl2'].forEach((id,i)=>{
    $(id).style.transform=`translateY(${f2(4*Math.sin(t*3+i)-40*out)}px) rotate(${f2(i?-1.5*Math.sin(t*2.4):0)}deg) scale(${(br*hb*kick*(1+0.3*out)).toFixed(4)})`;

// ---------- pills: one shape that morphs its colour/width while the text swaps with a short blur ----------
function pill(e,x,y,w,bg,o,rot){ if(!show(e,o))return false; e.style.width=f2(w)+'px'; e.style.background=bg;

function txt(ids,times,t){ ids.forEach((id,i)=>{const a=times[i], b=times[i+1]; const v=vis(t,i===0?null:a,b==null?null:b,{lin:0.16,lout:0.1,blur:8});

(function(){ const g=$('cticks'); for(let i=0;i<12;i++){const a=i/12*Math.PI*2; el('path',{d:`M${f2(540+Math.sin(a)*128)} ${f2(760-Math.cos(a)*128)}L${f2(540+Math.sin(a)*(i%3?140:118))} ${f2(760-Math.cos(a)*(i%3?140:118))}`},g);}

  // stress: bolt jitters, mouth zigzag
  A('bolt','transform',`translate(${f2(4*Math.sin(t*31))} ${f2(3*Math.cos(t*27))}) rotate(${f2(4*Math.sin(t*9))} 640 640)`);
  let md='M492 862'; for(let i=1;i<=6;i++) md+=` L${492+i*16} ${f2(862+(i%2?-12:8)+3*Math.sin(t*20+i))}`; A('hmouth','d',md);

  A('dcross','transform',`translate(672 602) rotate(${f2(6*Math.sin(t*3))}) scale(${f2(1+0.12*pulse(t,K.doctor,0.35))}) translate(-672 -602)`);

const THUMB=!!window.__THUMB;

  const t=0.95; scenes(t); world(t); title(0.2);

  const l1=$('tl1'), l2=$('tl2'); let l3=$('tl3'); if(!l3){l3=document.createElement('div'); l3.id='tl3'; l3.className='tl'; $('title').appendChild(l3);}
