<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>

<!-- Thumbnail (1 frame, 1080x1920) = thumbnail.md concept A: the frame-0 composition (same blurred plate + rounded tilted
     card of the astronaut floating in the ISS lab, same night grade), title zone Y 240-700: "ตดในอวกาศ?" Kanit 900, dark
     outline ("ตด" green-yellow, "ในอวกาศ?" white) + the green cartoon cloud of the clip (own drawing, same path) beside the

<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#071027}
#bg{position:absolute;left:-40px;top:-70px;width:1160px;height:2060px;object-fit:cover}
.card{position:absolute;left:130px;top:726px;width:780px;height:704px;overflow:hidden;border-radius:46px;transform:rotate(-2.5deg);
  box-shadow:0 0 0 10px #F4F8FF,0 0 0 19px #0A0E1C,0 36px 80px rgba(0,0,0,.65)}
.card img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover}
.shade{position:absolute;left:0;top:0;width:1080px;height:820px;background:linear-gradient(rgba(4,8,26,.85) 0%,rgba(4,8,26,.6) 60%,rgba(4,8,26,0) 100%)}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;
  -webkit-text-stroke:32px #0A0E1C;paint-order:stroke fill;text-shadow:0 16px 0 rgba(0,0,0,.5)}
#t1{top:236px;font-size:300px;color:#B8E04A}
#t2{top:520px;font-size:176px;color:#fff}
#fx{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">

  </g>

    <path d="M690 1050 q-16 -22 0 -44 t0 -44"/><path d="M750 1030 q-16 -22 0 -44 t0 -44 t0 -44"/><path d="M810 1050 q-16 -22 0 -44 t0 -44"/>
