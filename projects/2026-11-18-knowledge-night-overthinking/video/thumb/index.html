<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<!-- Thumbnail (1 frame, 1080x1920): same look as frame 0 of the clip (hook footage, same grade) + big Kanit 900 text "ตีสามแล้วยังคิด?",
     corner tag "รู้ไหม?" and a small 03:00 clock. Exported as JPG with ffmpeg from the rendered frame. -->
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#0B1630}
#kb{position:absolute;left:0;top:0;width:1080px;height:1920px;transform:scale(1.1);transform-origin:58% 48%}
#kb video{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.shade{position:absolute;left:0;top:0;width:1080px;height:980px;background:linear-gradient(rgba(8,14,32,.85),rgba(8,14,32,.55) 60%,rgba(8,14,32,0))}
.glow{position:absolute;left:560px;top:860px;width:640px;height:640px;border-radius:50%;mix-blend-mode:screen;
  background:radial-gradient(circle,rgba(205,222,255,.45) 0%,rgba(150,180,255,.15) 40%,rgba(150,180,255,0) 70%)}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;-webkit-text-stroke:34px #0A1022;paint-order:stroke fill;
  text-shadow:0 16px 30px rgba(5,8,20,.7)}
#t1{top:330px;font-size:214px;color:#F3EBDD}#t2{top:575px;font-size:236px;color:#FFB366}
.tag{position:absolute;top:150px;left:90px;padding:4px 36px 12px;border-radius:40px;background:#FFB366;border:9px solid #0A1022;
  color:#0A1022;font-weight:900;font-size:62px;white-space:nowrap;transform:rotate(-4deg)}
#pill{position:absolute;top:160px;right:90px;height:96px;padding:0 34px 0 100px;border-radius:48px;background:rgba(11,22,48,.88);border:6px solid #FFB366;
  color:#F3EBDD;font-weight:700;font-size:58px;line-height:84px;white-space:nowrap}
#pill svg{position:absolute;left:24px;top:14px}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<div id="kb"><video id="v" class="clip" data-start="0" data-duration="1" data-media-start="1.6" data-track-index="0" muted playsinline src="assets/hook.mp4" data-color-grading='{"adjust": {"exposure": -0.25, "contrast": 0.06, "temperature": -0.28, "saturation": -0.15}, "wheels": {"shadows": {"hue": 222, "amount": 0.55, "level": -0.12}, "midtones": {"hue": 225, "amount": 0.12, "level": 0}, "highlights": {"hue": 34, "amount": 0.06, "level": 0}}, "details": {"vignette": 0.4, "grain": 0.1}}'></video></div>
<div class="glow"></div><div class="shade"></div>
<div class="tag">รู้ไหม?</div>
<div id="pill"><svg width="60" height="60" viewBox="-30 -30 60 60"><circle r="25" fill="none" stroke="#FFB366" stroke-width="6"/>
  <path d="M0 -15 L0 0 L13 0" fill="none" stroke="#F3EBDD" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>03:00</div>
<div class="t" id="t1">ตีสามแล้ว</div><div class="t" id="t2">ยังคิด?</div>
</div><script>
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines["thumb"]=tl;</script></body></html>
