<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<!-- Thumbnail (1 frame, 1080x1920): same layout as frame 0 of the clip (hook kitten + glass plate assets/hook0.jpg = frame 0
     of video/assets/hook-v.mp4, same shade, line 2 "กลัวน้ำ?" at the same size/position), line 1 = tag "รู้ไหม?" + "แมว". -->
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#0B0B0B}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px}
.shade{position:absolute;left:0;top:0;width:1080px;height:820px;background:linear-gradient(rgba(5,5,10,.72),rgba(5,5,10,0))}
.t{font-weight:900;line-height:1;white-space:nowrap;-webkit-text-stroke:28px #10080A;paint-order:stroke fill;text-shadow:0 12px 0 rgba(0,0,0,.5)}
#row{position:absolute;left:0;top:262px;width:1080px;display:flex;justify-content:center;align-items:center;gap:26px}
#t1{font-size:186px;color:#fff}
#t2{position:absolute;left:0;top:470px;width:1080px;text-align:center;font-size:196px;color:#FFD23F}
.tag{padding:4px 36px 14px;border-radius:44px;background:#1E9BF0;border:9px solid #10080A;box-shadow:0 12px 0 rgba(0,0,0,.4);
  color:#fff;font-weight:900;font-size:70px;white-space:nowrap;transform:rotate(-5deg) translateY(10px)}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<img class="clip" id="bg" data-start="0" data-duration="1" data-track-index="0" src="assets/hook0.jpg" alt=""/>
<div class="shade"></div>
<div id="row"><div class="tag">รู้ไหม?</div><div class="t" id="t1">แมว</div></div>
<div class="t" id="t2">กลัวน้ำ?</div>
</div><script>
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines["thumb"]=tl;</script></body></html>
