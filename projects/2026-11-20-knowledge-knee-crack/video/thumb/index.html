<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<!-- Thumbnail / TikTok cover (1 frame, 1080x1920): same layout as frame 0 of the clip (squat photo band + big Kanit 900 text + tag),
     plus a lens showing the knee diagram from the clip (assets/knee-lens.jpg, taken from the render at 11.6 s, gas bubbles). -->
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#0B0B0B}
#fill{position:absolute;left:-60px;top:-100px;width:1200px;height:2133px}
#band{position:absolute;left:-30px;top:540px;width:1140px;height:1253px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 150px,#000 calc(100% - 150px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 150px,#000 calc(100% - 150px),transparent 100%)}
.shade{position:absolute;left:0;top:0;width:1080px;height:900px;background:linear-gradient(rgba(5,5,10,.8),rgba(5,5,10,0))}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;-webkit-text-stroke:30px #10080A;paint-order:stroke fill;
  text-shadow:0 14px 0 rgba(0,0,0,.5)}
#t1{color:#fff;top:330px;font-size:200px}#t2{color:#FFD23F;top:520px;font-size:180px}
.tag{position:absolute;top:236px;left:50%;padding:0 34px 8px;border-radius:36px;background:#1E9BF0;border:9px solid #10080A;
  color:#fff;font-weight:900;font-size:58px;white-space:nowrap;transform:translateX(-50%) rotate(-4deg)}
#lens{position:absolute;left:50px;top:1010px;width:380px;height:380px;border-radius:50%;overflow:hidden;border:16px solid #FFD23F;
  box-shadow:0 0 0 12px #10080A,0 0 80px 20px rgba(255,210,63,.55)}
#lens img{width:100%;height:100%}
#lk{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<img class="clip" id="fill" data-start="0" data-duration="1" data-track-index="0" src="assets/hook-fill.jpg" alt=""/>
<img class="clip" id="band" data-start="0" data-duration="1" data-track-index="1" src="assets/hook-crop.jpg" alt=""/>
<div class="shade"></div>
<svg id="lk" viewBox="0 0 1080 1920">
  <circle cx="563" cy="1264" r="135" fill="none" stroke="#10080A" stroke-width="26"/>
  <circle cx="563" cy="1264" r="135" fill="none" stroke="#FFD23F" stroke-width="14"/>
  <g stroke="#FFD23F" stroke-width="16" stroke-linecap="round"><path d="M700 1110 L745 1065"/><path d="M735 1185 L800 1170"/><path d="M640 1075 L655 1015"/><path d="M735 1300 L795 1325"/></g></svg>
<div id="lens"><img src="assets/knee-lens.jpg" alt=""/></div>
<div class="t" id="t1">กร๊อบ =</div><div class="t" id="t2">ข้อเสื่อม?</div>
<div class="tag" id="tag">รู้ไหม?</div>
</div><script>
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines["thumb"]=tl;</script></body></html>
