<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<!-- Thumbnail (1 frame, 1080x1920): same layout as frame 0 of the clip (yawning woman + big Kanit 900 text),
     woman at her widest yawn (assets/hook-frame.jpg = hook video at 1.8 s) plus a lens showing the head diagram
     with the red O2 gauge (assets/brain-o2.jpg, taken from the TH render at 3.03 s). Built by ../prep_assets.sh + README steps. -->
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#06070B}
#fill{position:absolute;left:0;top:0;width:1080px;height:1920px;opacity:.6}
#band{position:absolute;left:-367px;top:560px;width:1980px;height:1114px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 150px,#000 calc(100% - 150px),transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 150px,#000 calc(100% - 150px),transparent 100%)}
.shade{position:absolute;left:0;top:0;width:1080px;height:860px;background:linear-gradient(rgba(5,5,10,.8),rgba(5,5,10,0))}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;-webkit-text-stroke:30px #10080A;paint-order:stroke fill;
  text-shadow:0 14px 0 rgba(0,0,0,.5)}
#t1{color:#fff}#t2{color:#FFD23F}
#lens{position:absolute;left:640px;top:1150px;width:400px;height:400px;border-radius:50%;overflow:hidden;border:16px solid #FFD23F;
  box-shadow:0 0 0 12px #10080A,0 0 80px 20px rgba(255,210,63,.5)}
#lens img{width:100%;height:100%}
#lk{position:absolute;left:0;top:0;width:1080px;height:1920px}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920"
 data-composition-variables='[{"id":"lang","type":"string","label":"Language (th | en)","default":"th"}]'>
<img class="clip" id="fill" data-start="0" data-duration="1" data-track-index="0" src="assets/hook-fill.jpg" alt=""/>
<img class="clip" id="band" data-start="0" data-duration="1" data-track-index="1" src="assets/hook-frame.jpg" alt=""/>
<div class="shade"></div>
<svg id="lk" viewBox="0 0 1080 1920"><path d="M560 1300 L660 1300" stroke="#FFD23F" stroke-width="14" stroke-linecap="round" stroke-dasharray="6 22"/>
  <g stroke="#FFD23F" stroke-width="14" stroke-linecap="round"><path d="M410 1250 L360 1215"/><path d="M420 1330 L365 1360"/><path d="M400 1290 L345 1290"/></g></svg>
<div id="lens"><img src="assets/brain-o2.jpg" alt=""/></div>
<div class="t" id="t1"></div><div class="t" id="t2"></div>
</div><script>
const V=(window.__hyperframes&&window.__hyperframes.getVariables&&window.__hyperframes.getVariables())||{};
const en=V.lang==='en';
const t1=document.getElementById('t1'), t2=document.getElementById('t2');
t1.textContent=en?'YAWN =':'หาว ='; t2.textContent=en?'NO OXYGEN?':'ขาดออกซิเจน?';
t1.style.cssText=en?'top:190px;font-size:240px':'top:170px;font-size:250px';
t2.style.cssText=en?'top:450px;font-size:170px':'top:455px;font-size:146px';
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines["thumb"]=tl;</script></body></html>
