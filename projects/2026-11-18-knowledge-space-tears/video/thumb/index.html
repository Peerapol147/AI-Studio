<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#05070d}
#bg{position:absolute;left:0;top:0;width:1080px;height:1920px;object-fit:cover}
.shade{position:absolute;left:0;top:820px;width:1080px;height:1100px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.55) 35%,rgba(0,0,0,.6))}
.t{position:absolute;left:40px;width:1000px;top:930px;text-align:center;font-weight:900;line-height:1.2;
  -webkit-text-stroke:30px #0B1220;paint-order:stroke fill;white-space:nowrap}
.t .a{font-size:200px;color:#fff}.t .b{font-size:220px;color:#FFD23F}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<img class="clip" id="bg" data-start="0" data-duration="1" data-track-index="0" src="assets/bg.jpg" alt=""/>
<div class="shade"></div>
<div class="t" id="title"><div class="a">น้ำตา</div><div class="b">ไม่ตก?!</div></div>
</div><script>
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines["thumb"]=tl;</script></body></html>
