<!doctype html><html lang="th"><head><meta charset="UTF-8"/><link rel="stylesheet" href="fonts/fonts.css"/>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<!-- Thumbnail (1 frame, 1080x1920) = thumbnail.md concept A, our own graphic (no character art): the dark-continent map,
     Lake Möbius, the tiny glowing dot (known world) with a red circle + arrow, same look as frame 0 of the clip.
     Text "โลกฮันเตอร์ = จุดนี้" (Kanit 900, white, dark outline) + chips "Lore อนิเมะ #1" / "HUNTER×HUNTER" (plain text, not a logo).
     Nothing in Y 0-240 / 1440-1920, nothing important right of X 900 below Y 840. -->
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}
#root{position:relative;width:1080px;height:1920px;font-family:'Kanit';overflow:hidden;background:#05070F}
#map{position:absolute;left:0;top:0;width:1080px;height:1920px}
.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;color:#fff;
  -webkit-text-stroke:30px #07060A;paint-order:stroke fill;text-shadow:0 14px 0 rgba(0,0,0,.55)}
#t1{top:330px;font-size:172px}
#t2{top:530px;font-size:200px}
#t2 b{color:#FFE14D}
.chips{position:absolute;left:0;top:250px;width:1080px;display:flex;justify-content:center;gap:20px}
.chip{padding:0 26px 6px;height:62px;border-radius:31px;border:6px solid #07060A;font-weight:900;font-size:38px;line-height:52px;white-space:nowrap}
.lab{position:absolute;left:640px;top:1150px;font-weight:900;font-size:60px;color:#FFE7A8;-webkit-text-stroke:12px #07060A;paint-order:stroke fill;transform:rotate(-4deg);white-space:nowrap}
.scale{position:absolute;left:130px;top:1350px;font-weight:700;font-size:32px;color:#B8C4DC;-webkit-text-stroke:7px #07060A;paint-order:stroke fill}
</style></head><body>
<div id="root" data-composition-id="thumb" data-start="0" data-duration="1" data-width="1080" data-height="1920">
<svg id="map" class="clip" data-start="0" data-duration="1" data-track-index="0" viewBox="0 0 1080 1920">
  <defs>
    <radialGradient id="pap" cx="50%" cy="52%" r="65%"><stop offset="0" stop-color="#0E1830"/><stop offset=".5" stop-color="#081022"/><stop offset="1" stop-color="#04060D"/></radialGradient>
    <radialGradient id="gl"><stop offset="0" stop-color="#FFD873" stop-opacity=".95"/><stop offset=".35" stop-color="#F5C04A" stop-opacity=".4"/><stop offset="1" stop-color="#F5C04A" stop-opacity="0"/></radialGradient>
    <radialGradient id="fog"><stop offset="0" stop-color="#5A1838" stop-opacity=".6"/><stop offset="1" stop-color="#5A1838" stop-opacity="0"/></radialGradient>
    <radialGradient id="eye"><stop offset="0" stop-color="#FFF2B0"/><stop offset=".4" stop-color="#FF6A3D"/><stop offset="1" stop-color="#FF3B30" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1080" height="1920" fill="url(#pap)"/>
  <g id="cont"></g>
  <g id="lake"></g>
  <circle cx="540" cy="1000" r="120" fill="url(#gl)"/>
  <g id="kw"></g>
  <ellipse cx="540" cy="1000" rx="92" ry="86" fill="none" stroke="#E5383B" stroke-width="12" transform="rotate(-8 540 1000)"/>
  <ellipse cx="542" cy="998" rx="98" ry="90" fill="none" stroke="#E5383B" stroke-width="5" opacity=".7" transform="rotate(-14 540 1000)"/>
  <path d="M700 1150 C660 1135 640 1110 615 1075" fill="none" stroke="#FFE7A8" stroke-width="10" stroke-linecap="round"/>
  <path d="M606 1110 L612 1070 L650 1082" fill="none" stroke="#FFE7A8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="chips"><div class="chip" style="background:#F5C04A">Lore อนิเมะ #1</div><div class="chip" style="background:#E5383B;color:#fff">HUNTER×HUNTER</div></div>
<div class="t" id="t1">โลกฮันเตอร์</div>
<div class="t" id="t2">= <b>จุดนี้</b></div>
<div class="lab">โลกที่รู้จัก</div>
<div class="scale">ภาพประกอบ · ไม่ใช่สเกลจริง</div>
</div><script>
(function(){
const NS='http://www.w3.org/2000/svg', f2=v=>v.toFixed(2);
const el=(tag,a,p)=>{const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
const hsh=(i,seed)=>{let h=Math.imul(i|0,374761393)+Math.imul(seed|0,668265263);h=(h^(h>>>13))>>>0;h=Math.imul(h,1274126177)>>>0;return((h^(h>>>16))>>>0)/4294967296;};
// same lake outline as the clip (lakeR), scaled to 1.15 around the dot at (540,1000)
const Z=1.15, CX=540, CY=1000;
const lakeR=a=>300*(1+0.07*Math.sin(3*a+0.6)+0.05*Math.sin(5*a+1.9)+0.035*Math.sin(9*a+0.3));
let d=''; for(let i=0;i<=96;i++){const a=i/96*2*Math.PI,r=lakeR(a)*Z; d+=(i?'L':'M')+f2(CX+r*Math.cos(a))+' '+f2(CY+r*Math.sin(a));} d+='Z';
const cont=document.getElementById('cont'), lake=document.getElementById('lake');
el('path',{d:'M0 0 H1080 V1920 H0 Z '+d,'fill-rule':'evenodd',fill:'#140A16',opacity:.94},cont);
for(let i=0;i<5;i++) el('circle',{cx:f2(100+i*230),cy:f2(700+((i*397)%700)),r:420,fill:'url(#fog)'},cont);
for(let i=0;i<90;i++){const a=hsh(i,11)*2*Math.PI, r=(380+hsh(i,12)*900)*Z, s=(14+hsh(i,13)*26)*Z*0.8, x=CX+r*Math.cos(a), y=CY+r*Math.sin(a);
  el('path',{d:`M${f2(x-s)} ${f2(y)} L${f2(x)} ${f2(y-s*1.1)} L${f2(x+s)} ${f2(y)}`,fill:'none',stroke:'#4A2A48','stroke-width':2.5},cont);}
[[180,620],[900,700],[140,1250],[920,1300],[300,1480],[820,560]].forEach(([x,y],i)=>{const g=el('g',{transform:`translate(${x} ${y}) scale(1.6)`},cont);
  el('ellipse',{cx:-11,cy:0,rx:7,ry:4.5,fill:'url(#eye)'},g); el('ellipse',{cx:11,cy:0,rx:7,ry:4.5,fill:'url(#eye)'},g);});
el('path',{d,fill:'#0A1A36'},lake);
[60,140,220,300].forEach(r=>el('circle',{cx:CX,cy:CY,r,fill:'none',stroke:'#2C5590','stroke-width':2,opacity:.45},lake));
el('path',{d,fill:'none',stroke:'#3D6FB0','stroke-width':4,opacity:.8},lake);
const kw=document.getElementById('kw');
[[-3,-2,4.6],[4,1,3.4],[-1,5,2.8],[5,-5,2.2],[-6,3,1.8]].forEach(([x,y,r],i)=>{let p='';for(let j=0;j<=20;j++){const a=j/20*2*Math.PI,rr=r*(1+0.18*Math.sin(3*a+i))*4.4;p+=(j?'L':'M')+f2(CX+x*4.4+rr*Math.cos(a))+' '+f2(CY+y*4.4+rr*Math.sin(a));} el('path',{d:p+'Z',fill:'#F5C04A'},kw);});
})();
const tl=gsap.timeline({paused:true});window.__timelines=window.__timelines||{};window.__timelines["thumb"]=tl;</script></body></html>
