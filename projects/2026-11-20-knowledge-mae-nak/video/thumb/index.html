<!-- Thumbnail (1 frame, 1080x1920) = thumbnail.md concept A: the frame-0 image (hook-a at source 2.0 s, same crop and

<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden}

.t{position:absolute;left:0;width:1080px;text-align:center;font-weight:900;line-height:1;white-space:nowrap;color:#fff;
  -webkit-text-stroke:30px #10080A;paint-order:stroke fill;text-shadow:0 14px 0 rgba(0,0,0,.5)}
#t1{top:364px;font-size:196px}
#t2{top:548px;font-size:150px}
.tag{position:absolute;left:50%;top:256px;transform:translateX(-50%) rotate(-4deg);padding:2px 40px 12px;border-radius:44px;background:#FFE14D;
  border:9px solid #10080A;box-shadow:0 12px 0 rgba(0,0,0,.45);color:#10080A;font-weight:900;font-size:76px;white-space:nowrap}
#brain{position:absolute;left:0;top:0;width:1080px;height:1920px}
