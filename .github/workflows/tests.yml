name: tests
on:
  push:
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pytest numpy soundfile scipy matplotlib librosa
      # no API keys, no MP4 render of the clip; sound_pass_vo mixes a 3-second synthetic test only
      - run: python -m pytest -q tests
